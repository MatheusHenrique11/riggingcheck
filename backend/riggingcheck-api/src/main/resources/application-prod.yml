server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  price:
    basic: ${STRIPE_PRICE_BASIC:price_placeholder_basic}
    unlimited: ${STRIPE_PRICE_UNLIMITED:price_placeholder_unlimited}
  success-url: ${STRIPE_SUCCESS_URL:${APP_BASE_URL}}
  cancel-url: ${STRIPE_CANCEL_URL:${APP_BASE_URL}/pricing}

alert:
  digest:
    enabled: ${ALERT_DIGEST_ENABLED:false}
    cron: ${ALERT_DIGEST_CRON:0 0 7 * * MON-FRI}
    from: ${SMTP_FROM}
    base-url: ${APP_BASE_URL}

logging:
  level:
    org.springframework.security: WARN
    com.riggingcheck: INFO
    org.hibernate.SQL: WARN
