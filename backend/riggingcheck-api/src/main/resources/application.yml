server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:riggingcheck
    driver-class-name: org.h2.Driver
  h2:
    console:
      # Nunca habilitar em produção — acesso direto ao banco sem autenticação extra
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    # Desabilitado para evitar vazamento de dados sensíveis nos logs
    show-sql: false
