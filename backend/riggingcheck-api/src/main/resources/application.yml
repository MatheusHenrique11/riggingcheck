server:
  port: ${PORT:8080}

spring:
  application:
    name: riggingcheck-api
  datasource:
    url: jdbc:h2:mem:riggingcheck
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  price:
    basic: ${STRIPE_PRICE_BASIC:price_placeholder_basic}
    unlimited: ${STRIPE_PRICE_UNLIMITED:price_placeholder_unlimited}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/pricing}

alert:
  digest:
    enabled: ${ALERT_DIGEST_ENABLED:false}
    cron: ${ALERT_DIGEST_CRON:0 0 7 * * MON-FRI}
    from: ${SMTP_FROM:noreply@riggingcheck.com}
    base-url: ${APP_BASE_URL:https://riggingcheck.app}

logging:
  level:
    org.springframework.security: INFO
    com.riggingcheck: INFO
